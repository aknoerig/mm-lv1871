name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lua installieren
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Syntax prüfen
        run: luac5.4 -p "LV 1871.lua" test/*.lua

      - name: Tests ausführen
        run: lua5.4 test/run.lua
